name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel --target g3asm g3asm_script g3asm_loader g3asm_packmod g3asm_dev g3asm_cli g3asm_test g3asm_loader_test g3asm_sb_stub

      - name: FPU fix active (no fninit)
        shell: pwsh
        run: |
          ./tools/check_no_fninit.ps1 -Dll build/g3asm/g3asm.dll
          ./tools/check_no_fninit.ps1 -Dll (Get-ChildItem build/g3asm -Filter 'Script_G3ASM_*.dll' | Select-Object -First 1).FullName

      # Same tests as ci.yml: a tag must not produce a release that the CI would reject.
      - name: Self test and test mods (stub SharedBase)
        shell: pwsh
        run: |
          ./build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll tests/scripts/selftest.as
          if ($LASTEXITCODE -ne 0) { throw "self test failed ($LASTEXITCODE)" }
          ./build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll tests/mods
          if ($LASTEXITCODE -ne 0) { throw "test mods failed ($LASTEXITCODE)" }

      - name: Loader test (stub SharedBase, system dbghelp)
        shell: pwsh
        run: |
          ./tests/run_loader_test.ps1 -SharedBase build/sbstub/SharedBase.dll -DbghelpOrig "$env:WINDIR\SysWOW64\dbghelp.dll" -BuildDir build
          if ($LASTEXITCODE -ne 0) { throw "loader test failed ($LASTEXITCODE)" }

      - name: PackMod numbering
        run: python -I tests/packmod_generations.py build/g3asm/g3asm_packmod.exe

      - name: File patches overlay (stub SharedBase)
        run: python -I tests/file_patches_overlay.py build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll

      - name: Packed mods (stub SharedBase)
        run: python -I tests/packed_mods.py build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll build/g3asm/g3asm_packmod.exe

      - name: Release package (stub SharedBase)
        run: python -I tests/packmod_release.py build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll build/g3asm/g3asm_packmod.exe

      - name: Dev pipe (stub SharedBase)
        run: python -I tests/dev_pipe.py build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll build/g3asm/g3asm_dev.exe

      # Hot reload: the globals keep their values, main() runs again, const values from the new code, keepglobals=0, a run with a syntax error.
      - name: Hot reload keeps globals (stub SharedBase)
        run: python -I tests/keep_globals.py build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll build/g3asm/g3asm_dev.exe

      # Command line g3asm.exe: new, check (without the game, also all example mods), pack, release, log, each with --json.
      - name: Command line g3asm (stub SharedBase)
        run: python -I tests/cli.py build/g3asm/g3asm.exe build/sbstub/SharedBase.dll

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'manual-${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build release package
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDir build -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: g3asm-${{ steps.ver.outputs.version }}
          path: dist/*.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $extra = @()
          # Tags with a hyphen (v0.30.0-alpha.1, v1.0.0-rc.2) are pre-releases.
          if ($tag.Contains('-')) { $extra += '--prerelease' }
          gh release create $tag (Get-ChildItem dist/*.zip).FullName --title "G3 AngelScript Modkit $tag" --generate-notes @extra
