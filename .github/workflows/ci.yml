name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AngelScript and MinHook are not in the repository (thirdparty/ is ignored); CMake downloads them (AngelScript with checksum).
      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel --target g3asm g3asm_loader g3asm_packmod g3asm_test g3asm_loader_test g3asm_sb_stub

      - name: Check build output
        shell: pwsh
        run: |
          foreach ($f in 'build/g3asm/g3asm.dll', 'build/loader/dbghelp.dll', 'build/g3asm/g3asm_packmod.exe', 'build/g3asm/g3asm_test.exe', 'build/g3asm/g3asm_loader_test.exe', 'build/sbstub/SharedBase.dll') {
            if (-not (Test-Path $f)) { throw "$f is missing" }
            "{0,-32} {1,9} bytes" -f $f, (Get-Item $f).Length
          }

      - name: FPU fix active (no fninit)
        shell: pwsh
        run: ./tools/check_no_fninit.ps1 -Dll build/g3asm/g3asm.dll

      # Static analysis with the checks from .clang-tidy. Report only for now: the runner's clang-tidy is newer than the one the code base
      # was cleaned with (LLVM 15) and may know more checks; make this step blocking (-Strict, no continue-on-error) once it has run clean here.
      - name: clang-tidy (report only)
        shell: pwsh
        continue-on-error: true
        run: ./tools/run_clang_tidy.ps1 -BuildDir build

      # The real SharedBase.dll is a game file and not in the repository; tests/sb_stub builds a stand-in with the same exports.
      - name: Self test (stub SharedBase)
        shell: pwsh
        run: |
          ./build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll tests/scripts/selftest.as
          if ($LASTEXITCODE -ne 0) { throw "self test failed ($LASTEXITCODE)" }

      - name: Test mods (stub SharedBase)
        shell: pwsh
        run: |
          ./build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll tests/mods
          if ($LASTEXITCODE -ne 0) { throw "test mods failed ($LASTEXITCODE)" }

      # Compile check of all example mods. The example set deliberately breaks the override-chain check (several mods override the
      # same hook), so exactly that one failure is expected; any script error or other failure fails the step.
      - name: Example mods compile (stub SharedBase)
        shell: pwsh
        run: |
          $out = ./build/g3asm/g3asm_test.exe build/sbstub/SharedBase.dll examples/mods 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          # exit code = number of failed checks (1 = the expected override-chain failure); >= 100 means the test runner itself failed
          if ($rc -ge 100) { throw "test runner failed to start ($rc)" }
          if ($out -match 'Skript enthaelt Fehler|nicht ladbar|Skript nicht geladen') { throw "an example mod does not compile" }
          $fails = ([regex]::Matches($out, 'PRUEFUNG FEHLGESCHLAGEN: (.*)') | ForEach-Object { $_.Groups[1].Value.Trim() })
          $unexpected = $fails | Where-Object { $_ -notlike 'Override-Kette ueber mehrere Mods*' }
          if ($unexpected) { throw "unexpected failures: $($unexpected -join '; ')" }
          if ($rc -ne $fails.Count) { throw "exit code $rc does not match $($fails.Count) reported failure(s)" }
          "Only the expected override-chain failure: OK"
          # GitHub appends 'exit $LASTEXITCODE' to pwsh steps; the runner's expected exit code 1 must not fail the step
          exit 0

      - name: Loader test (stub SharedBase, system dbghelp)
        shell: pwsh
        run: |
          ./tests/run_loader_test.ps1 -SharedBase build/sbstub/SharedBase.dll -DbghelpOrig "$env:WINDIR\SysWOW64\dbghelp.dll" -BuildDir build
          if ($LASTEXITCODE -ne 0) { throw "loader test failed ($LASTEXITCODE)" }

      - name: PackMod numbering
        run: python -I tests/packmod_generations.py build/g3asm/g3asm_packmod.exe

      - name: Build a sample release package
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDir build -Version ci-${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: g3asm-ci-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 7
